# Example configuration for the locally-resolved EIS pipeline.
#
# Every value here influences a result and is folded into `param_hash`, which
# is written into every output row. Two runs with the same hash and the same
# git SHA are the same computation.
#
#   python run_pipeline.py --config config/example.yaml

measurement_id: "2611976"
conditions: []                    # empty = every condition found
raw_dir: /Volumes/.../Famos
output_dir: ./out/2611976

acquisition:
  fs_nominal: 10000.0
  filename_template: "Leepa_{measurement_id}_Current_{condition}_Test_{test}_Karte_{card}.DAT"
  test_index: "01"

  # Per-channel delay *within* a card, relative to that card's own time base.
  # This is the offset that does NOT cancel in the impedance ratio, so it has
  # to be measured - feed one signal into every input in parallel and record
  # the result, then put the numbers here. Leave empty only if the DAQ is
  # genuinely simultaneous-sampling; the assumption is recorded in the output.
  channel_delay_table: {}
  #   2:
  #     "37": 5.0e-8
  #     UC2:  0.0
  channel_delay_table_version: assumed-simultaneous

  # Wiring polarity per card and channel: -1 inverts. Resolve the sign of Z
  # once from the wiring, rather than by voting on the data every run.
  polarity: {}
  default_polarity: 1

geometry:
  segment_area_cm2: 4.235
  cell_area_cm2: 304.92
  plate_w_mm: 252.0
  plate_h_mm: 121.0
  n_segments: 80
  # segment_coords: {1: [x_cm, y_cm, half_w_cm, half_h_cm], ...}
  # Needed for the temperature field and for physically laid-out plate maps.
  segment_coords: {}

calibration:
  shunt_csv: cal/curr.csv         # per segment: c0;c1  ->  H(T)=c0+1e-3*c1*T
  temperature_csv: cal/temp.csv   # per sensor:  c0;c1  ->  T=(V-c0)/c1
  use_measured_temperature: true  # false pins H to the fallback (degraded)
  temperature_fallback_c: 58.4
  temperature_valid_range_c: [0.0, 200.0]

sync:
  band_hz: [20.0, 4000.0]         # where the shared cell voltage is coherent
  nperseg: 32768
  min_coherence: 0.90
  min_bins: 16
  n_drift_blocks: 8
  drift_correction_threshold_ppm: 0.5
  residual_tolerance_s: 1.0e-7    # 100 ns; 73 ns is 0.1 deg at 3.8 kHz
  closure_tolerance_s: 2.0e-7
  max_intercept_rad: 0.05
  max_lag_s: 0.1                  # bound the coarse search to plausible skew
  allow_segment_proxy: true       # timing fallback when a UC channel is dead
  segment_proxy_sigma_s: 1.0e-5

  # same_card : pair each segment with the cell voltage on its own card.
  #             Bulk card offset cancels in the ratio - the accurate default.
  # reference : one global cell voltage for everything; needs full alignment.
  # auto      : same_card, falling back to reference for cards whose own
  #             cell-voltage channel fails the health check.
  uc_strategy: auto
  uc_min_rms_v: 0.002

spectral:
  # auto -> synchronous when base_frequency_hz and excitation_tones_hz are set,
  # otherwise coherence-gated Welch.
  method: auto
  estimator: hv                   # hv | h1 | h2  (h1 under-reads by gamma^2)

  # Designed multisine. When known these ARE the analysis frequencies; tone
  # detection then only verifies them. Leaving them unset falls back to Welch,
  # which pays a leakage penalty on off-bin tones.
  base_frequency_hz: null
  excitation_tones_hz: null
  periods_per_window: 4

  nperseg: 8192                   # Welch fallback: df = fs/nperseg
  noverlap: null                  # null = nperseg // 2
  window: hann
  detrend: linear

  f_min_hz: 1.0
  f_max_hz: 4000.0

  gate_windows: true              # reject contaminated windows before averaging
  amplitude_mad_k: 4.0
  phase_outlier_rad: 0.5
  max_rejected_fraction: 0.5

  min_coherence: 0.70
  min_points_per_segment: 5

  apply_notch: true
  notch_freqs_hz: [50.0, 100.0, 150.0]
  notch_q: 30.0

validation:
  run_lin_kk: true
  kk_max_elements: 30
  kk_mu_target: 0.85              # Schoenleber stopping criterion
  kk_max_residual_pct: 1.0
  run_stationarity: true
  stationarity_tolerance: 0.05
  run_admittance_sum: true        # sum(A_k/Z_k) vs the cell-level reference

model:
  run_ecm: true
  models: [R_L, R_L_1RQ, R_L_2RQ] # add R_L_1RQ_W where transport matters
  n_starts: 6
  max_nfev: 5000
  max_relative_sigma: 0.30        # wider than this is flagged, not plotted
